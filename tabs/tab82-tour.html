<title>Dep Graph &mdash; Interactive Tour</title>
<style>
/* ════════════════════════════════════════════════════════════
   Permission Sets Browser Interactive Tour — fully self-contained
   Same engine and palette as the other Calumet tours.
   All names, users and numbers are invented.
   ════════════════════════════════════════════════════════════ */
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --sbg:#142540;--sbg2:#1a3050;--sborder:#244568;
  --stxt:#e2e8f0;--smut:#8892a4;--sacc:#2ea4c9;
  --blue:#2980b9;--green:#27ae60;--orange:#e67e22;--red:#E74C3C;
  --hdr:#1A5276;
}
body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#0f1d33;color:var(--stxt);min-height:100vh;display:flex;flex-direction:column}

#topbar{background:var(--sbg);border-bottom:1px solid var(--sborder);padding:14px 28px 12px;flex-shrink:0}
#topbar h1{font-size:18px;font-weight:800;color:#fff;letter-spacing:.2px}
#topbar h1 .badge{font-size:10px;background:#1e3a5e;color:var(--smut);padding:2px 8px;border-radius:12px;font-weight:400;margin-left:8px;vertical-align:middle}
#topbar .sub{font-size:12px;color:#a8b4c8;margin-top:3px}
#progress{display:flex;align-items:center;margin-top:14px;flex-wrap:wrap}
.dot{display:flex;align-items:center;gap:7px;cursor:pointer;user-select:none}
.dot .circle{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;
  background:var(--sbg2);border:1px solid var(--sborder);color:var(--smut);transition:all .25s ease}
.dot.done .circle{background:var(--green);border-color:var(--green);color:#fff}
.dot.active .circle{background:var(--sacc);border-color:var(--sacc);color:#fff;box-shadow:0 0 0 4px rgba(46,164,201,.22)}
.dot:hover .circle{border-color:var(--sacc)}
.connector{width:18px;height:2px;background:var(--sborder);margin:0 4px;flex-shrink:0}
.connector.done{background:var(--green)}

#stage{flex:1;padding:26px 28px;display:flex;flex-direction:column;align-items:center;position:relative;overflow:auto}
#scene-frame{width:100%;max-width:1040px;background:#e8eef2;border-radius:8px;padding:1px;box-shadow:0 8px 30px rgba(0,0,0,.4);position:relative}
#scene-body{position:relative}

/* ── app mockup ── */

.m-title{padding:8px 12px 6px;background:#eef5fb;border-bottom:1px solid #c9d9e6}
.m-title b{display:block;font-size:13px;color:#1A5276}
.m-title span{font-size:11px;color:#33485c}
.m-body{background:#F8F8F8;padding:10px 12px;min-height:420px}
.hbox{display:flex;flex-direction:row;flex-wrap:wrap}
.spacer{flex:1}

.cat-sys{display:inline-block;padding:1px 10px;border-radius:5px;background:#d35400;color:#fff;font-weight:700;font-size:10px}
.fbar{border:1px solid #c5d6e3;background:#eef5fb;border-radius:3px;padding:7px 9px;margin-top:8px;font-size:11px}

/* cursor / ripple / popup / nav */
#cursor{position:fixed;left:0;top:0;width:30px;height:30px;z-index:9999;pointer-events:none;transform:translate(-100px,-100px);
  transition:transform .6s cubic-bezier(.4,0,.2,1);filter:drop-shadow(0 2px 3px rgba(0,0,0,.45))}
#ripple{position:fixed;left:0;top:0;width:14px;height:14px;border-radius:50%;border:2px solid var(--sacc);background:rgba(46,164,201,.25);
  z-index:9998;pointer-events:none;opacity:0;transform:translate(-50%,-50%) scale(.3)}
#ripple.go{animation:rip .65s ease-out}
@keyframes rip{0%{opacity:.9;transform:translate(-50%,-50%) scale(.3)}100%{opacity:0;transform:translate(-50%,-50%) scale(3.4)}}
#popup{position:fixed;z-index:10000;max-width:340px;background:#fff;color:#1a2a35;border-radius:8px;border-left:4px solid var(--sacc);
  box-shadow:0 10px 36px rgba(0,0,0,.45);padding:14px 16px 13px;opacity:0;pointer-events:none;transform:translateY(8px) scale(.97);transition:opacity .3s,transform .3s}
#popup.show{opacity:1;pointer-events:auto;transform:none}
#popup .p-title{font-size:13.5px;font-weight:800;color:var(--hdr);margin-bottom:6px}
#popup .p-text{font-size:12.5px;line-height:1.55;color:#33485c}

#popup .p-btn{margin-top:11px;float:right;background:var(--sacc);color:#fff;border:none;padding:5px 14px;border-radius:5px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit}
#popup::after{clear:both;content:"";display:block}
#nav{flex-shrink:0;background:var(--sbg);border-top:1px solid var(--sborder);padding:11px 28px;display:flex;align-items:center;gap:12px}
.nav-btn{background:var(--sbg2);color:var(--stxt);border:1px solid var(--sborder);padding:7px 18px;border-radius:6px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit}
.nav-btn:hover:not(:disabled){background:#244568;border-color:var(--sacc)}
.nav-btn:disabled{opacity:.35;cursor:not-allowed}
.nav-btn.primary{background:var(--sacc);border-color:var(--sacc);color:#fff}
#scene-counter{font-size:12px;color:var(--smut)}
#nav .spacer{flex:1}
#autoplay{background:transparent;border:1px solid var(--sborder);color:var(--stxt);width:38px;height:38px;border-radius:8px;font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center}
#autoplay.on{background:var(--sacc);border-color:var(--sacc);color:#fff}

.recap{padding:30px 34px;color:#1a2a35;background:#F8F8F8;border-radius:8px}

.tips{display:flex;gap:14px;flex-wrap:wrap}

.tip.cycle{border-top-color:var(--green)}
.tip .icon{font-size:20px;display:block;margin-bottom:6px}

.back-site{display:inline-block;margin-bottom:6px;font-size:12px;color:#7fd4ec;text-decoration:none;opacity:.9}
.back-site:hover{text-decoration:underline;opacity:1}

.vtabs{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:6px 0 8px}
.vt{padding:3px 11px;border:1px solid #b9c7d3;border-radius:4px;background:#fff;font-size:10.5px;color:#4a5d6e;font-family:Georgia,serif}

.info{border-left:3px solid #2c6aa8;background:#eaf2fa;padding:7px 10px;font-size:10.5px;color:#2c3e50;margin:6px 0;line-height:1.45}
.card{background:#fff;border:1px solid #d4e2ec;border-radius:6px;padding:8px 10px;margin-top:8px}

.split{display:flex;gap:10px;align-items:stretch}
.lcol{width:300px;flex-shrink:0;background:#fff;border:1px solid #d4e2ec;border-radius:6px;padding:8px}

<body>

<div id="topbar">
  <a class="back-site" id="backSite" href="../demos.html">&larr; All demos</a>
  <h1>Dep Graph &mdash; Interactive Tour <span class="badge">Tab 82 &middot; Interactive Tour</span></h1>
  <div class="sub">A guided walkthrough: compute the dependency graph once, then explore who uses what, what is dead and where a change ripples.</div>
  <div id="progress"></div>
</div>

<div id="stage">
  <div id="scene-frame"><div id="scene-body"></div></div>
</div>

<div id="nav">
  <button class="nav-btn" id="btn-prev">&larr; Prev</button>
  <span id="scene-counter">1 / 1</span>
  <div class="spacer"></div>
  <button id="autoplay" title="Auto-play">&#9654;</button>
  <button class="nav-btn primary" id="btn-next">Next &rarr;</button>
</div>

<svg id="cursor" viewBox="0 0 28 28"><path d="M5 2 L5 22 L10 17 L13 24 L16 23 L13 16 L20 16 Z" fill="#fff" stroke="#1a2a35" stroke-width="1.4" stroke-linejoin="round"/></svg>
<div id="ripple"></div>
<div id="popup"><div class="p-title"></div><div class="p-text"></div><button class="p-btn">Got it &rarr;</button></div>

<script>
"use strict";

/* ───────────────────────── Helpers ───────────────────────── */
var $ = function(sel,ctx){return (ctx||document).querySelector(sel);};
var sceneBody = $("#scene-body");
var sceneFrame = $("#scene-frame");
var cursor = $("#cursor"), ripple = $("#ripple"), popup = $("#popup");

/* One colour per scene, by NAME: dots and counter are derived from the scene registry. */
var COL = {list:"#2980b9", search:"#8e44ad", badges:"#27ae60", changes:"#8e44ad", assigns:"#27ae60", overlap:"#e67e22", detail:"#16a085", recap:"#27ae60"};

var pending = [];
function after(ms, fn){ var id = setTimeout(fn, ms); pending.push(id); return id; }
var typeInterval = null;
function clearPending(){ pending.forEach(clearTimeout); pending = []; if(typeInterval){clearInterval(typeInterval);typeInterval=null;} }

function pointAt(targetEl, title, text, color, side){
  if(!targetEl) return;
  var r = targetEl.getBoundingClientRect();
  var x = r.left + r.width/2, y = r.top + r.height/2;
  cursor.style.transform = "translate(" + (x-3) + "px," + (y-2) + "px)";
  after(620, function(){
    ripple.style.left = x + "px"; ripple.style.top = y + "px";
    ripple.classList.remove("go"); void ripple.offsetWidth; ripple.classList.add("go");
  });
  after(1420, function(){ showPopup(title, text, color, targetEl, side); });
}
function showPopup(title, text, color, anchorEl, side){
  $(".p-title", popup).textContent = title;
  $(".p-text", popup).innerHTML = text;
  popup.style.borderLeftColor = color || "#2ea4c9";
  $(".p-btn", popup).style.background = color || "#2ea4c9";
  popup.classList.add("show");
  var pr = popup.getBoundingClientRect();
  var ar = anchorEl ? anchorEl.getBoundingClientRect() : sceneFrame.getBoundingClientRect();
  var left = ar.left + ar.width/2 - pr.width/2, top;
  if(side === "above"){ top = ar.top - pr.height - 14; } else { top = ar.bottom + 14; }
  var vw = window.innerWidth, vh = window.innerHeight;
  if(left < 12) left = 12;
  if(left + pr.width > vw - 12) left = vw - 12 - pr.width;
  if(top < 12) top = ar.bottom + 14;
  if(top + pr.height > vh - 12) top = ar.top - pr.height - 14;
  if(top < 12) top = 12;
  popup.style.left = left + "px"; popup.style.top = top + "px";
}
function hidePopup(){ popup.classList.remove("show"); }

/* Several explanations in a row: each "Got it" moves to the next element, the last one to the next scene.
   step = {sel,title,text,color,side,before}. Waits (up to ~8 s) for a target that is still animating in. */
var popupNextFn = null;
function popupChain(steps){
  var i = 0, tries = 0, prepared = false;
  function show(){
    var s = steps[i], last = (i === steps.length-1);
    popupNextFn = null;   // nothing to answer while the next step is being prepared
    // The step's own action runs FIRST (it may open the window that holds its target) ...
    if(!prepared){ prepared = true; if(s.before) s.before(); }
    // ... then wait (up to ~8 s) for a target that is still animating in.
    if(!$(s.sel) && tries++ < 20){ after(400, show); return; }
    tries = 0; prepared = false;
    popupNextFn = last ? null : function(){ hidePopup(); i++; after(300, show); };
    after(s.before ? 450 : 0, function(){ pointAt($(s.sel), s.title, s.text, s.color, s.side); });
  }
  show();
}
function typeInto(el, text, speed, done){
  el.value = ""; var i = 0;
  typeInterval = setInterval(function(){
    el.value = text.slice(0, ++i);
    if(i >= text.length){ clearInterval(typeInterval); typeInterval = null; if(done) done(); }
  }, speed || 38);
}
function btn(cls, label, id, extra){ return '<button class="cal-btn '+cls+'"'+(id?' id="'+id+'"':'')+(extra||'')+'>'+label+'</button>'; }
function overlay(title, width, top, body){

}

    '<div class="tbl-wrap"><table class="cal-tbl"><thead><tr><th>OBJECT</th><th class="c">RECORDS</th><th class="c" id="mc-power">POWER</th><th class="c">DEPTH</th><th class="c">MD DEPTH</th><th class="c">CASCADE DEL.</th><th class="c" id="mc-lock">LOCK PRESSURE</th><th>SHARING (INT/EXT)</th></tr></thead><tbody>'+
    rows.map(function(r){
      var sh = function(v){ return '<span class="nt '+(v==="Private"?"obj":"wl")+'" style="'+(v==="ControlledByParent"?"background:#f3d4d1;color:#c0392b":"")+'">'+v+'</span>'; };
      return '<tr><td><b>'+r[0]+'</b></td><td class="c">'+r[1]+'</td><td class="c"><b>'+r[2]+'</b></td><td class="c">'+r[3]+'</td><td class="c"><b>'+r[4]+'</b></td><td class="c">'+r[5]+'</td><td class="c"><b>'+r[6]+'</b></td><td>'+sh(r[7])+' '+sh(r[8])+'</td></tr>';
    }).join("")+'</tbody></table></div></div>');
}
sceneMcd.run = function(){
  popupChain([
    {sel:"#mc-info", title:"Where a mistake ripples widest", color:COL.mcd, side:"below",
     text:"The <b>MCD</b> (the data model between objects) ranks every object by its <b>power</b>: how many records sit below it and how tightly they are bound. A master-detail weighs more than an optional lookup. Start with the top rows before touching the model."},
    {sel:"#mc-power", title:"Power, depth, cascade", color:COL.mcd, side:"below",
     text:"<b>Power</b> is the score used to sort. <b>Depth</b> is how many levels of children hang below the object; <b>Cascade del.</b> is how many child records a delete would take with it."},
    {sel:"#mc-lock", title:"Lock pressure and sharing", color:COL.mcd, side:"below",
     text:"<b>Lock pressure</b> estimates the risk of row-lock contention on a parent that has many children. <b>Sharing (int/ext)</b> shows the internal and external model: <em>ControlledByParent</em> children inherit the parent&#39;s access."},
    {sel:"#mc-t2", title:"Lookup cycles", color:COL.mcd, side:"below",
     text:"The second list shows <b>lookup cycles</b> (A &rarr; B &rarr; A). They complicate data loads, deletions and deployments: you cannot order them cleanly."}
  ]);
};

/* ───────── 6 — Orphan tests ───────── */
function sceneTests(){
  var names = ["AccountTriggerHandlerTest","InvoiceBatchTest","LegacyQuoteTest","ContactSyncTest","DunningSchedulerTest","OrderTriggerTest","RenewalHelperTest","TestDataFactoryExtra","SubscriptionTest","PricingTest"];
  sceneBody.innerHTML = frame("mcd","Orphan tests",
    '<div class="kpis"><div class="kpi"><b class="o">32</b><span>orphan tests (of 156)</span></div><div class="kpi"><b>32</b><span>cover nothing (empty / stub)</span></div><div class="kpi"><b>0</b><span>cover only dead code</span></div></div>'+
    '<div class="info" id="ot-info">A test class is an <b>entry point</b>: nothing references it, so it never shows up in &laquo;Dead metadata&raquo;. It becomes worthless from the other end &mdash; when it <b>covers nothing live</b>. <b>Covers nothing</b> = no edge to any production component. <b>Covers only dead code</b> = everything it touches is itself dead: delete that cluster and the test goes with it.</div>'+
    '<div class="card" id="ot-list"><h4>Orphan test classes</h4><div class="grp"><span class="tri">&#9660;</span><span class="red">32</span>covers nothing</div>'+
    '<div class="names" style="padding-left:6px">'+names.map(function(n){ return '<span><span class="sq"></span> '+n+' <span class="ch">&lt;/&gt;</span></span>'; }).join("")+'</div></div>');
}
sceneTests.run = function(){
  popupChain([
    {sel:"#ot-info", title:"Tests that protect nothing", color:COL.tests, side:"below",
     text:"A test is never &laquo;dead&raquo; &mdash; nothing calls it by design. So Calumet looks at it the other way round: <b>what does it cover?</b> A test that touches no production component protects nothing."},
    {sel:"#ot-list", title:"Covers nothing / covers only dead code", color:COL.tests, side:"above",
     text:"<b>Covers nothing</b>: an empty or stub test, safe to review for removal. <b>Covers only dead code</b>: it goes away with the dead cluster it tests. Coverage here is <em>static</em> (what the code references): a test that drives code dynamically is invisible, so review before deleting."}
  ]);
};

/* ───────── 7 — Extractor gaps ───────── */
function sceneGaps(){
  sceneBody.innerHTML = frame("mcd","Extractor gaps",
    '<div class="kpis"><div class="kpi"><b class="o">2</b><span>false dead (edges missed by an extractor)</span></div><div class="kpi"><b>2</b><span>gap families (dead type &larr; referrer type)</span></div></div>'+
    '<div class="info" id="eg-info">Each group = a probable <b>extractor gap family</b>: same dead metadata type, same dominant referrer type according to Salesforce. A group with several nodes is worth investigating first (the same fix will often fix all its members). Hover the list of referrers for the detail provided by Salesforce.</div>'+
    '<div class="card" id="eg-list"><h4>Extractor gaps by family (dead type &larr; dominant referrer type)</h4>'+
    '<div class="grp"><span class="tri">&#9660;</span><span class="red">1</span>'+pill("field","field")+' &larr; '+pill("flow","Flow")+'</div>'+
    '<div class="names" style="padding-left:6px"><span><span class="sq" style="background:#3e8e96"></span> Task.DueInNext7Days__c <span class="nt flow" style="margin-left:6px">9 ref</span></span></div>'+
    '<div class="grp"><span class="tri">&#9660;</span><span class="red">1</span>'+pill("flexi","flexipage")+' &larr; '+pill("obj","CustomObject")+'</div>'+
    '<div class="names" style="padding-left:6px"><span><span class="sq" style="background:#7b4a1e"></span> quote_record_page <span class="nt obj" style="margin-left:6px">1 ref</span></span></div></div>');
}
sceneGaps.run = function(){
  popupChain([
    {sel:"#eg-info", title:"Where the graph is blind", color:COL.gaps, side:"below",
     text:"Salesforce says something references these nodes, yet the graph found <em>no</em> edge to them. They look dead but may not be. They are listed apart, <b>never counted as alive</b>, so you can see exactly where an extractor needs to be improved."},
    {sel:"#eg-list", title:"Read it as a to-do list for the tool", color:COL.gaps, side:"above",
     text:"Each family names the dead type and who references it (here a <em>field</em> referenced by a <em>flow</em>). Fixing one extractor usually clears the whole family. Until then: <b>do not delete</b> these nodes."}
  ]);
};

/* ───────── 8 — Recap ───────── */
var recapItems = [
  "Computed the graph once from production (<b>Recompute from org</b>) &mdash; sandboxes just display it",
  "Found any node in the <b>Explorer</b> and read who uses it, and how",
  "Listed the <b>dead metadata</b>, grouped by type, with the <em>ref</em> cross-check",
  "Freed whole chains at once with the <b>clusters</b>",
  "Ranked objects by blast radius in <b>MCD risk</b>, and spotted tests that cover nothing"
];
function sceneRecap(){
  sceneBody.innerHTML =
  '<div class="recap"><h2>You can now read the graph</h2>'+
  '<div class="lead">One computation, then every question &mdash; who uses this? what is dead? what breaks if I change it? &mdash; answered offline.</div>'+
  '<ul class="recap-list" id="recap-list">'+recapItems.map(function(t,i){ return '<li id="rl-'+i+'"><span class="chk">&#10003;</span><span>'+t+'</span></li>'; }).join("")+'</ul>'+
  '<div class="tips">'+
    '<div class="tip"><span class="icon">&#128161;</span><b>Recompute after changes.</b> The graph is a snapshot: rebuild it after a deployment or a big clean-up, so the views match the org.</div>'+
    '<div class="tip warn"><span class="icon">&#9888;&#65039;</span><b>Dead is a question, not a verdict.</b> Dynamic references, managed packages and <em>ref</em> badges all call for a check before any deletion.</div>'+
    '<div class="tip cycle"><span class="icon">&#129517;</span><b>Next step.</b> The other audit tabs (Org Discovery, Dead Metadata, Automation Radar&hellip;) read this same graph &mdash; build it first.</div>'+
  '</div></div>';
}
sceneRecap.run = function(){
  for(var i=0;i<recapItems.length;i++){ (function(i){ after(250+i*220, function(){ var li=$("#rl-"+i); if(li) li.classList.add("in"); }); })(i); }
};

var SCENE_LIST = [
  {fn:sceneStart,    run:sceneStart.run},
  {fn:sceneExplorer, run:sceneExplorer.run},
  {fn:sceneDead,     run:sceneDead.run},
  {fn:sceneClusters, run:sceneClusters.run},
  {fn:sceneMcd,      run:sceneMcd.run},
  {fn:sceneTests,    run:sceneTests.run},
  {fn:sceneGaps,     run:sceneGaps.run},
  {fn:sceneRecap,    run:sceneRecap.run}
];

/* ───────────────────────── Registry & engine ───────────────────────── */
var scenes = SCENE_LIST;
var current = 0;
function buildProgress(){
  var html = "";
  for(var i=0;i<scenes.length;i++){
    html += '<div class="dot" data-i="'+i+'"><span class="circle">'+(i+1)+'</span></div>';
    if(i<scenes.length-1) html += '<div class="connector"></div>';
  }
  $("#progress").innerHTML = html;
  [].forEach.call($("#progress").querySelectorAll(".dot"), function(d){
    d.addEventListener("click", function(){ goTo(parseInt(d.getAttribute("data-i"),10)); });
  });
}
function updateProgress(){
  [].forEach.call($("#progress").querySelectorAll(".dot"), function(d,i){ d.classList.toggle("active", i===current); d.classList.toggle("done", i<current); });
  [].forEach.call($("#progress").querySelectorAll(".connector"), function(c,i){ c.classList.toggle("done", i<current); });
}
function goTo(i){
  if(i<0 || i>=scenes.length) return;
  clearPending(); hidePopup(); popupNextFn = null;
  cursor.style.transition = "none"; cursor.style.transform = "translate(-120px,-120px)"; void cursor.offsetWidth;
  current = i; scenes[i].fn(); updateProgress();
  $("#scene-counter").textContent = (i+1) + " / " + scenes.length;
  $("#btn-prev").disabled = (i===0);
  $("#btn-next").textContent = (i===scenes.length-1) ? "Restart ↺" : "Next →";
  after(60, function(){ cursor.style.transition = "transform .6s cubic-bezier(.4,0,.2,1)"; scenes[i].run(); });
}
function goNext(){ if(current === scenes.length-1){ goTo(0); } else goTo(current+1); }
function goPrev(){ goTo(current-1); }
$("#btn-next").addEventListener("click", goNext);
$("#btn-prev").addEventListener("click", goPrev);
$(".p-btn", popup).addEventListener("click", function(){ (popupNextFn || goNext)(); });
document.addEventListener("keydown", function(e){
  if(e.key === "ArrowRight" || e.key === " "){ e.preventDefault(); goNext(); }
  else if(e.key === "ArrowLeft"){ e.preventDefault(); goPrev(); }
});
var playTimer = null, autoBtn = $("#autoplay");
autoBtn.addEventListener("click", function(){
  if(playTimer){ autoBtn.classList.remove("on"); autoBtn.innerHTML = "&#9654;"; clearInterval(playTimer); playTimer = null; }
  else { autoBtn.classList.add("on"); autoBtn.innerHTML = "&#10073;&#10073;"; playTimer = setInterval(goNext, 6000); }
});
window.addEventListener("resize", function(){ if(popup.classList.contains("show")) hidePopup(); });
buildProgress();
goTo(0);
</script>
