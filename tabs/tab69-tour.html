<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>User Access Score — Interactive Tour — Calumet</title>
<style>
/* ════════════════════════════════════════════════════════════
   User Access Score Interactive Tour — fully self-contained
   Palette adapted from shared.css (Calumet doc pages)
   ════════════════════════════════════════════════════════════ */
*{box-sizing:border-box;margin:0;padding:0}

:root{
  --sbg:#142540;--sbg2:#1a3050;--sborder:#244568;
  --stxt:#e2e8f0;--smut:#8892a4;--sacc:#2ea4c9;
  --blue:#2980b9;--green:#27ae60;--orange:#e67e22;--red:#E74C3C;
  --hdr:#1A5276;
}

body{
  font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
  background:#0f1d33;color:var(--stxt);
  min-height:100vh;display:flex;flex-direction:column;
}

/* ── Top bar ── */
#topbar{
  background:var(--sbg);border-bottom:1px solid var(--sborder);
  padding:14px 28px 12px;flex-shrink:0;
}
#topbar h1{font-size:18px;font-weight:800;color:#fff;letter-spacing:.2px}
#topbar h1 .badge{
  font-size:10px;background:#1e3a5e;color:var(--smut);
  padding:2px 8px;border-radius:12px;font-weight:400;margin-left:8px;vertical-align:middle}
#topbar .sub{font-size:12px;color:#a8b4c8;margin-top:3px}

/* ── Progress dots ── */
#progress{
  display:flex;align-items:center;gap:0;margin-top:14px;flex-wrap:wrap;
}
.dot{
  display:flex;align-items:center;gap:7px;cursor:pointer;user-select:none;
}
.dot .circle{
  width:26px;height:26px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:700;
  background:var(--sbg2);border:1px solid var(--sborder);color:var(--smut);
  transition:all .25s ease;
}
.dot .lbl{font-size:10.5px;color:var(--smut);white-space:nowrap;transition:color .25s}
.dot.done .circle{background:var(--green);border-color:var(--green);color:#fff}
.dot.active .circle{background:var(--sacc);border-color:var(--sacc);color:#fff;
  box-shadow:0 0 0 4px rgba(46,164,201,.22)}
.dot.active .lbl{color:#fff;font-weight:700}
.dot:hover .circle{border-color:var(--sacc)}
.connector{width:14px;height:2px;background:var(--sborder);margin:0 3px;flex-shrink:0}
.connector.done{background:var(--green)}

/* ── Stage (mockup area) ── */
#stage{
  flex:1;padding:26px 28px;display:flex;flex-direction:column;
  align-items:center;position:relative;overflow:auto;
}
#scene-frame{
  width:100%;max-width:1000px;background:#e8eef2;border-radius:8px;
  padding:1px;box-shadow:0 8px 30px rgba(0,0,0,.4);position:relative;
}
#scene-body{position:relative}

/* ════════════════════════════════════════════
   APP MOCKUP STYLES  (light Calumet theme)
   ════════════════════════════════════════════ */
.mockup{font-family:"Segoe UI",sans-serif;font-size:12px;color:#1a2a35;background:#F8F8F8;border-radius:8px;overflow:hidden}
.m-tabpane{display:flex;flex-direction:column;background:#F8F8F8}
.m-tabbar{display:flex;background:#D8E6EE;border-bottom:1px solid #9AABBF;flex-shrink:0;overflow-x:auto}
.m-tab{padding:6px 13px;cursor:default;font-weight:700;font-size:11px;color:#2C3E50;border-right:1px solid #b0c8d8;user-select:none;white-space:nowrap}
.m-tab.done{background:#27ae60;color:#fff;border-right-color:#1e8a4a}
.m-tab.act{background:#F8F8F8;color:#1A5276;border-bottom:2px solid #F8F8F8;margin-bottom:-1px}
.m-body{background:#F8F8F8;padding:12px;min-height:430px}

/* header block: title, active-config band, step chips */
.m-title{padding:8px 12px 6px;background:#eef5fb;border-bottom:1px solid #c9d9e6}
.m-title b{display:block;font-size:13px;color:#1A5276}
.m-title span{font-size:11px;color:#33485c}
.m-band{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:6px 12px;background:#eef5fb;border-bottom:1px solid #c9d9e6}
.m-stepper{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:8px 12px 2px;background:#eef5fb}
.st{display:flex;align-items:center;gap:6px}
.st .c{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;background:#e3e7ea;color:#55687a;border:1px solid #cfd6db;flex-shrink:0}
.st.done .c{background:#27ae60;border-color:#27ae60;color:#fff}
.st.act .c{background:#2c6fd1;border-color:#2c6fd1;color:#fff}
.st .t{font-weight:700;font-size:11px;color:#1a2a35;line-height:1.1}
.st.done .t{color:#1e8a4a}
.st.act .t{color:#2c6fd1}
.st .s{font-size:9px;color:#55687a;line-height:1.2;white-space:nowrap}
.st-sep{color:#9AABBF;font-size:11px;margin:0 2px}
.st-opt{font-style:italic;font-size:10px;color:#7f8c8d;margin:0 4px 0 6px}
.m-hint{padding:2px 12px 7px;background:#eef5fb;font-size:10.5px;color:#4a5f70;border-bottom:1px solid #c9d9e6}

.vbox{display:flex;flex-direction:column}
.hbox{display:flex;flex-direction:row;flex-wrap:wrap}
.split-pane{display:flex;gap:4px}
.split-panel{flex:1;min-width:0}
.spacer{flex:1}
.vsep{width:1px;background:#9AABBF;align-self:stretch;margin:0 4px}
.hsep{border:none;border-top:1px solid #9AABBF;margin:4px 0}

.cal-btn{padding:4px 11px;border-radius:3px;font-size:11px;font-weight:700;cursor:pointer;border:1px solid #9AABBF;font-family:inherit;white-space:nowrap;transition:opacity .2s,filter .2s}
.cal-btn:hover{filter:brightness(1.06)}
.btn-d{background:#E8EEF2;color:#2C3E50;border-color:#9AABBF}
.btn-b{background:#2980b9;color:#fff;border-color:#1f6699}
.btn-g{background:#27ae60;color:#fff;border-color:#1e8a4a}
.btn-o{background:#e67e22;color:#fff;border-color:#b8621a}
.btn-r{background:#E74C3C;color:#fff;border-color:#c03a2b}
.cal-btn.dim{opacity:.5;pointer-events:none}
.cal-btn[disabled]{opacity:.4;pointer-events:none}

.cal-lbl{font-size:12px;color:#1a2a35}
.cal-tf,.cal-ta,.cal-cb{padding:3px 7px;background:#fff;border:1px solid #9AABBF;border-radius:3px;font-size:11px;color:#1a2a35;font-family:inherit}
.cal-tf{height:24px}
.cal-ta{resize:none;width:100%}
.cal-cb{height:24px}
.cal-grow{flex:1;min-width:0}
.cal-chk{display:flex;align-items:center;gap:4px;font-size:11px;white-space:nowrap}
.cal-chk input{accent-color:var(--sacc)}

.card{border:1px solid #c9d6df;background:#fbfdff;border-radius:4px;padding:8px 10px}
.card-h{display:flex;align-items:center;gap:7px;font-weight:700;font-size:12px;color:#1a2a35;margin-bottom:7px}
.sec-num{width:19px;height:19px;border-radius:50%;background:#2c6fd1;color:#fff;font-size:10.5px;font-weight:700;display:inline-flex;align-items:center;justify-content:center}
.note-i{font-size:10.5px;font-style:italic;color:#3d7a8a}

.tbl-wrap{overflow-x:auto;border:1px solid #9AABBF;border-radius:3px;margin:2px 0}
.cal-tbl{border-collapse:collapse;width:100%;font-size:11px}
.cal-tbl th{background:#b8d5e3;color:#1A5276;font-weight:700;padding:4px 8px;text-align:left;border-right:1px solid #9AABBF;white-space:nowrap}
.cal-tbl th:last-child{border-right:none}
.cal-tbl td{padding:3px 8px;border-top:1px solid #d8e8f0}
.cal-tbl td.n,.cal-tbl th.n{text-align:center}
.cal-tbl tr.flash-orange{background:#ffe3c4;transition:background .4s}
.cal-tbl tr.ignored td{color:#9aa8b3}
.cal-tbl .empty-row td{text-align:center;color:#55687a;padding:34px 8px}
.lnk{color:#2980b9;text-decoration:underline;cursor:pointer}
.lnk-red{color:#C0392B;font-weight:700;text-decoration:underline;cursor:pointer}

.cal-listview{border:1px solid #9AABBF;background:#fff;min-height:80px;border-radius:3px;font-size:11px}

.pill{display:inline-block;padding:1px 9px;border-radius:10px;color:#fff;font-size:10px;font-weight:700}
.pill.p{background:#27ae60}
.pill.pc{background:#2c7fb8}
.pill.c{background:#e67e22}

/* overlay windows (popups) */
.backdrop{position:absolute;left:0;top:0;right:0;bottom:0;background:rgba(20,37,64,.18);z-index:4;border-radius:8px}
.win{color:#1a2a35;font-family:"Segoe UI",sans-serif;font-size:12px;position:absolute;left:50%;transform:translateX(-50%);top:46px;z-index:5;background:#f6f6f6;border:1px solid #8a9aa8;border-radius:6px;box-shadow:0 12px 34px rgba(0,0,0,.45);overflow:hidden}
.win-title{display:flex;align-items:center;gap:8px;padding:6px 10px;background:#eceff2;border-bottom:1px solid #cdd5db;font-size:11px;color:#33485c}
.win-title .x{margin-left:auto;color:#55687a}
.win-body{padding:10px 12px}
.win-h{font-weight:800;font-size:13px;color:#1a2a35}
.win-sub{font-size:10px;color:#7f8c8d;margin-left:8px}
.mono{font-family:Consolas,"Courier New",monospace;font-size:11px}
.fail-box{border:1px solid #9AABBF;background:#fff;border-radius:3px;padding:8px 10px;font-family:Consolas,"Courier New",monospace;font-size:10.5px;line-height:1.55;color:#1a2a35;min-height:230px}

/* Row fade-in animation */
.row-in{animation:rowIn .35s ease both}
@keyframes rowIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* Spinner */
.spin{display:inline-block;width:13px;height:13px;border:2px solid rgba(41,128,185,.25);border-top-color:#2980b9;border-radius:50%;animation:sp .7s linear infinite;vertical-align:middle}
@keyframes sp{to{transform:rotate(360deg)}}

/* Mockup progress bar */
.pbar-track{flex:1;height:16px;background:#c8dae6;border-radius:3px;overflow:hidden}
.pbar-fill{width:0;height:100%;background:#2980b9;transition:width .12s linear}

/* ── Animated cursor ── */
#cursor{
  position:fixed;left:0;top:0;width:30px;height:30px;z-index:9999;
  pointer-events:none;transform:translate(-100px,-100px);
  transition:transform .6s cubic-bezier(.4,0,.2,1);
  filter:drop-shadow(0 2px 3px rgba(0,0,0,.45));
}
#ripple{
  position:fixed;left:0;top:0;width:14px;height:14px;border-radius:50%;
  border:2px solid var(--sacc);background:rgba(46,164,201,.25);
  z-index:9998;pointer-events:none;opacity:0;
  transform:translate(-50%,-50%) scale(.3);
}
#ripple.go{animation:rip .65s ease-out}
@keyframes rip{0%{opacity:.9;transform:translate(-50%,-50%) scale(.3)}100%{opacity:0;transform:translate(-50%,-50%) scale(3.4)}}

/* ── Popup bubble ── */
#popup{
  position:fixed;z-index:10000;max-width:340px;
  background:#fff;color:#1a2a35;border-radius:8px;
  border-left:4px solid var(--sacc);
  box-shadow:0 10px 36px rgba(0,0,0,.45);
  padding:14px 16px 13px;opacity:0;pointer-events:none;
  transform:translateY(8px) scale(.97);transition:opacity .3s,transform .3s;
}
#popup.show{opacity:1;pointer-events:auto;transform:none}
#popup .p-title{font-size:13.5px;font-weight:800;color:var(--hdr);margin-bottom:6px}
#popup .p-text{font-size:12.5px;line-height:1.55;color:#33485c}
#popup .p-text em{color:#2980b9;font-style:normal;font-weight:700}
#popup .p-text code{background:#eef3f7;padding:0 4px;border-radius:3px;font-size:11.5px}
#popup .p-btn{
  margin-top:11px;float:right;background:var(--sacc);color:#fff;border:none;
  padding:5px 14px;border-radius:5px;font-size:12px;font-weight:700;cursor:pointer;
  font-family:inherit;transition:filter .2s}
#popup .p-btn:hover{filter:brightness(1.1)}
#popup::after{clear:both;content:"";display:block}

/* ── Bottom nav ── */
#nav{
  flex-shrink:0;background:var(--sbg);border-top:1px solid var(--sborder);
  padding:11px 28px;display:flex;align-items:center;gap:12px;
}
.nav-btn{
  background:var(--sbg2);color:var(--stxt);border:1px solid var(--sborder);
  padding:7px 18px;border-radius:6px;font-size:13px;font-weight:700;cursor:pointer;
  font-family:inherit;transition:all .2s}
.nav-btn:hover:not(:disabled){background:#244568;border-color:var(--sacc)}
.nav-btn:disabled{opacity:.35;cursor:not-allowed}
.nav-btn.primary{background:var(--sacc);border-color:var(--sacc);color:#fff}
.nav-btn.primary:hover{filter:brightness(1.1);background:var(--sacc)}
#scene-counter{font-size:12px;color:var(--smut)}
#nav .spacer{flex:1}
#autoplay{background:transparent;border:1px solid var(--sborder);color:var(--stxt);
  width:38px;height:38px;border-radius:8px;font-size:15px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;transition:all .2s}
#autoplay:hover{border-color:var(--sacc);color:var(--sacc)}
#autoplay.on{background:var(--sacc);border-color:var(--sacc);color:#fff}

/* ── Recap scene ── */
.recap{padding:30px 34px;color:#1a2a35;background:#F8F8F8;border-radius:8px}
.recap h2{font-size:22px;color:var(--hdr);margin-bottom:4px;font-weight:800}
.recap .lead{font-size:13px;color:#55687a;margin-bottom:20px}
.recap-list{list-style:none;margin-bottom:24px}
.recap-list li{
  display:flex;align-items:center;gap:10px;font-size:13.5px;padding:6px 0;
  color:#2c3e50;opacity:0;transform:translateX(-10px);transition:all .4s}
.recap-list li.in{opacity:1;transform:none}
.recap-list li .chk{
  width:22px;height:22px;border-radius:50%;background:var(--green);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0}
.recap-list li.opt .chk{background:#9aabbf}
.recap-list li b{color:var(--hdr)}
.tips{display:flex;gap:14px;flex-wrap:wrap}
.tip{
  flex:1;min-width:200px;background:#fff;border:1px solid #d4e2ec;border-radius:8px;
  padding:14px 16px;font-size:12.5px;line-height:1.5;color:#3a4d5e;
  border-top:3px solid var(--blue)}
.tip.warn{border-top-color:var(--orange)}
.tip.cycle{border-top-color:var(--green)}
.tip .icon{font-size:20px;display:block;margin-bottom:6px}
.tip b{color:var(--hdr)}

/* status line inside mockups */
.statusline{font-size:11px;font-style:italic;transition:opacity .3s}
.back-site{display:inline-block;margin-bottom:6px;font-size:12px;color:#7fd4ec;text-decoration:none;opacity:.9}
.back-site:hover{text-decoration:underline;opacity:1}
/* ════ User Access Score specifics ════ */
#scene-frame{zoom:1.2;width:calc(96% / 1.2);max-width:1150px}
.cal-tbl td{white-space:nowrap}
.m-tabbar{flex-wrap:wrap}
.orgbar{display:flex;align-items:center;gap:12px;padding:6px 12px;background:#c0392b;color:#fff;font-size:12px}
.orgsel{background:#cfe3ee;color:#1a2a35;border:1px solid #9AABBF;padding:2px 10px;border-radius:3px;min-width:130px}
.cal-tbl tr.lv-crit td{background:#ffd3d3}
.cal-tbl tr.lv-vhigh td{background:#ffe4e4}
.cal-tbl tr.lv-high td{background:#ffeede}
.cal-tbl tr.lv-mod td{background:#fff8dc}
.cal-tbl tr.lv-min td{background:#fff}
.cal-tbl tr.picked td{background:#d3d3d3}
.cal-tbl td.red{color:#c0392b;font-weight:700}
.cal-tbl td.dlt.up{color:#c0392b;font-weight:700}
.cal-tbl td.dlt.dn{color:#27ae60;font-weight:700}
.flag{display:inline-block;padding:0 7px;border-radius:9px;color:#fff;font-size:9.5px;font-weight:700;margin:0 1px}
.flag.int{background:#805ad5}
.flag.dor{background:#718096}
.count-line{font-size:10.5px;color:#55687a;margin-top:3px}
.rtabs{display:flex;gap:2px;border-bottom:1px solid #9AABBF;margin-bottom:4px}
.rtab{padding:4px 10px;font-weight:700;font-size:11px;color:#2C3E50;background:#D8E6EE;border:1px solid #b0c8d8;border-bottom:none;cursor:default}
.rtab.on{background:#F8F8F8;color:#1A5276}
.empty-pane{padding:60px 14px;text-align:center;color:#55687a;font-size:12px;line-height:1.8}
.typ{display:inline-block;min-width:34px;padding:1px 8px;border-radius:4px;color:#fff;font-size:10px;font-weight:700;text-align:center}
.typ.pro{background:#2c3e50}
.typ.ps{background:#718096}
.redund{display:inline-block;padding:1px 9px;border-radius:9px;background:#e67e22;color:#fff;font-size:10px;font-weight:700}
.cal-tbl td.xc.has{background:#fbd5d5;color:#1a2a35;font-weight:700}
.cal-tbl td.xc.cell-sel{background:#3d7a8a !important;color:#fff}
.sumline{padding:6px 8px;margin-bottom:6px;background:#eef5fb;border:1px solid #c9d9e6;border-radius:3px;font-size:11px;color:#33485c}
.wgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px 28px}
.wrow{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px}
.cal-chk input[type=checkbox]{accent-color:#2980b9}

</style>
</head>
<body>

<div id="topbar">
  <a class="back-site" id="backSite" href="../demos.html">&larr; All demos</a>
  <h1>User Access Score <span class="badge">Tab 69 · Interactive Tour</span></h1>
  <div class="sub">A guided walkthrough of the privilege ranking: who holds the most power in an org, why, and what to do about it. Fictional data.</div>
  <div id="progress"></div>
</div>

<div id="stage">
  <div id="scene-frame">
    <div id="scene-body"></div>
  </div>
</div>

<div id="nav">
  <button class="nav-btn" id="btn-prev">&larr; Prev</button>
  <span id="scene-counter">1 / 1</span>
  <div class="spacer"></div>
  <button id="autoplay" title="Auto-play">&#9654;</button>
  <button class="nav-btn primary" id="btn-next">Next &rarr;</button>
</div>

<!-- floating elements -->
<svg id="cursor" viewBox="0 0 28 28">
  <path d="M5 2 L5 22 L10 17 L13 24 L16 23 L13 16 L20 16 Z"
        fill="#fff" stroke="#1a2a35" stroke-width="1.4" stroke-linejoin="round"/>
</svg>
<div id="ripple"></div>

<div id="popup">
  <div class="p-title"></div>
  <div class="p-text"></div>
  <button class="p-btn">Got it &rarr;</button>
</div>

<script>
"use strict";

/* ───────────────────────── Helpers ───────────────────────── */
var $ = function(sel,ctx){return (ctx||document).querySelector(sel);};
var sceneBody = $("#scene-body");
var sceneFrame = $("#scene-frame");
var cursor = $("#cursor");
var ripple = $("#ripple");
var popup = $("#popup");


/* timers we must clear on scene change */
var pending = [];
function after(ms, fn){ var id = setTimeout(fn, ms); pending.push(id); return id; }
function clearPending(){ pending.forEach(clearTimeout); pending = []; if(typeInterval){clearInterval(typeInterval);typeInterval=null;} if(playTimer){/*keep autoplay*/} }
var typeInterval = null;

/* Move the animated cursor to viewport coords of an element, fire ripple + popup */
function pointAt(targetEl, popupTitle, popupText, color, popupSide){
  if(!targetEl) return;
  var r = targetEl.getBoundingClientRect();
  var x = r.left + r.width/2;
  var y = r.top + r.height/2;
  // cursor tip is roughly top-left of svg, offset so the point lands on target
  cursor.style.transform = "translate(" + (x-3) + "px," + (y-2) + "px)";
  // ripple after the move completes
  after(620, function(){
    ripple.style.left = x + "px";
    ripple.style.top = y + "px";
    ripple.classList.remove("go");
    void ripple.offsetWidth; // reflow
    ripple.classList.add("go");
  });
  // popup ~0.8s after click
  after(620 + 800, function(){
    showPopup(popupTitle, popupText, color, targetEl, popupSide);
  });
}

function showPopup(title, text, color, anchorEl, side){
  $(".p-title", popup).textContent = title;
  $(".p-text", popup).innerHTML = text;
  popup.style.borderLeftColor = color || "#2ea4c9";
  $(".p-btn", popup).style.background = color || "#2ea4c9";
  // position relative to anchor
  popup.classList.add("show");
  // need measured size -> position after it's visible
  var pr = popup.getBoundingClientRect();
  var ar = anchorEl ? anchorEl.getBoundingClientRect() : sceneFrame.getBoundingClientRect();
  var left = ar.left + ar.width/2 - pr.width/2;
  var top;
  if(side === "above"){ top = ar.top - pr.height - 14; }
  else { top = ar.bottom + 14; }
  // clamp to viewport
  var vw = window.innerWidth, vh = window.innerHeight;
  if(left < 12) left = 12;
  if(left + pr.width > vw - 12) left = vw - 12 - pr.width;
  if(top < 12) top = ar.bottom + 14;
  if(top + pr.height > vh - 12) top = ar.top - pr.height - 14;
  if(top < 12) top = 12;
  popup.style.left = left + "px";
  popup.style.top = top + "px";
}
function hidePopup(){ popup.classList.remove("show"); }

/* A scene often explains several things in a row. Each "Got it" moves to the next element of the
   list; the last one moves on to the next scene. step = {sel,title,text,color,side,before}. */
var popupNextFn = null;
function popupChain(steps){
  var i = 0;
  var tries = 0;
  function show(){
    var s = steps[i];
    var last = (i === steps.length-1);
    var el = $(s.sel);
    // The target may still be animating in (a row, a link): wait for it instead of skipping the step.
    if(!el && tries++ < 20){ after(400, show); return; }
    tries = 0;
    if(s.before) s.before();
    popupNextFn = last ? null : function(){ hidePopup(); i++; after(300, show); };
    pointAt($(s.sel), s.title, s.text, s.color, s.side);
  }
  show();
}

/* type text into a textarea char by char */
function typeInto(el, text, speed, done){
  el.value = "";
  var i = 0;
  typeInterval = setInterval(function(){
    el.value = text.slice(0, ++i);
    el.scrollTop = el.scrollHeight;
    if(i >= text.length){ clearInterval(typeInterval); typeInterval=null; if(done) done(); }
  }, speed || 38);
}

/* append log lines progressively to a textarea */
function streamLog(el, lines, speed, done){
  var i = 0;
  function step(){
    if(i >= lines.length){ if(done) done(); return; }
    el.value += (el.value ? "\n" : "") + lines[i++];
    el.scrollTop = el.scrollHeight;
    after(speed || 220, step);
  }
  step();
}

/* Click helper: glide the cursor to an element, ripple, then run cb */
function clickAt(el, cb){
  if(!el) return;
  var r = el.getBoundingClientRect();
  var x = r.left + Math.min(r.width/2, 40), y = r.top + r.height/2;
  cursor.style.transform = "translate(" + (x-3) + "px," + (y-2) + "px)";
  after(640, function(){
    ripple.style.left = x + "px"; ripple.style.top = y + "px";
    ripple.classList.remove("go"); void ripple.offsetWidth; ripple.classList.add("go");
    if(cb) cb();
  });
}

          var ua = $("#btn-unassign"); ua.removeAttribute("disabled");
          after(500, function(){
            showPopup("Assign / UnAssign", "Select cells of the grid, then <b>Assign</b> gives that permission set to the user of the column, and <b>UnAssign</b> takes it away. <em>It is applied in the org immediately</em>, permission set assignments only: the profile row is never touched. On a <b>production</b> org, Calumet asks for a confirmation first.", COL.compare, $("#btn-assign"), "below");
            popupNextFn = null;
          });
        });
      };
    });
  });
};

/* ───────────────────────── Scene 7 — weight breakdown ───────────────────────── */

function scene7(){
  sceneBody.innerHTML = chrome69(usersTable({sel:[1]}) + detailPane());
}
scene7.run = function(){
  after(900, function(){
    clickAt($("#rt-weights"), function(){
      $(".split-pane").lastElementChild.outerHTML = weightsPane();
      popupChain([
        {sel:"#wsum", title:"A score you can explain", color:COL.breakdown, side:"below",
         text:"Instead of a bare number, Calumet writes <em>one sentence</em> naming the few objects that make up half of the score. It is the answer to &laquo;why is this user ranked so high?&raquo;."},
        {sel:"#th-base", title:"Base and Weighted", color:COL.breakdown, side:"below",
         text:"<b>Base</b> is the plain points of the object under the chosen weighting. <b>Weighted</b> applies the <em>relation power</em>: an object that many others point to is worth more than an isolated one."},
        {sel:"#th-mult", title:"The multiplier", color:COL.breakdown, side:"below",
         text:"<b>&times;1.5</b> means the object is a hub of the data model. <b>&times;1.0</b> is neutral. Untick <em>Weight by relation power</em> and every multiplier goes back to 1.0."}
      ]);

};

/* ───────────────────────── Scene 8 — export & recap ───────────────────────── */
var recapItems = [

  ["spot integration accounts (INT), dormant accounts (90d+) and score changes (&#916;)", "flag"],
  ["choose the weighting that matches your concern: data, admin power, or your own", "weights"],

  ["compare 2 to 5 users, then assign or unassign permission sets", "compare"],
  ["read a one-sentence explanation of a score in the Weight breakdown tab", "breakdown"],
  ["export the ranking to Excel", "export"]
];

    '<h2>You can now audit who can do what</h2>'+

/* ───────────────────────── Scene registry ───────────────────────── */
var scenes = [
  {fn:scene1, run:scene1.run},   // ranking
  {fn:scene2, run:scene2.run},   // filters
  {fn:scene3, run:scene3.run},   // flags, additive/effective, delta
  {fn:scene4, run:scene4.run},   // weighting profiles
  {fn:scene5, run:scene5.run},   // access detail
  {fn:scene6, run:scene6.run},   // compare + assign
  {fn:scene7, run:scene7.run},   // weight breakdown
  {fn:scene8, run:scene8.run}    // recap
];


/* ───────────────────────── Engine ───────────────────────── */
var current = 0;

function buildProgress(){
  var p = $("#progress");
  var html = "";
  for(var i=0;i<scenes.length;i++){
    html += '<div class="dot" data-i="'+i+'"><span class="circle">'+(i+1)+'</span></div>';
    if(i<scenes.length-1) html += '<div class="connector" data-c="'+i+'"></div>';
  }
  p.innerHTML = html;
  p.querySelectorAll(".dot").forEach(function(d){
    d.addEventListener("click", function(){ goTo(parseInt(d.getAttribute("data-i"),10)); });
  });
}

function updateProgress(){
  var dots = $("#progress").querySelectorAll(".dot");
  var conns = $("#progress").querySelectorAll(".connector");
  dots.forEach(function(d,i){
    d.classList.toggle("active", i===current);
    d.classList.toggle("done", i<current);
  });
  conns.forEach(function(c,i){ c.classList.toggle("done", i<current); });
}

function goTo(i){
  if(i<0 || i>=scenes.length) return;
  clearPending();
  hidePopup();
  popupNextFn = null;   // a chain left over from the previous scene must not answer this scene's "Got it"
  // park cursor off-screen during transition
  cursor.style.transition = "none";
  cursor.style.transform = "translate(-120px,-120px)";
  void cursor.offsetWidth;
  current = i;
  scenes[i].fn();
  updateProgress();
  $("#scene-counter").textContent = (i+1) + " / " + scenes.length;
  $("#btn-prev").disabled = (i===0);
  $("#btn-next").textContent = (i===scenes.length-1) ? "Restart ↺" : "Next →";
  // restore transition then run the scene animation
  after(60, function(){
    cursor.style.transition = "transform .6s cubic-bezier(.4,0,.2,1)";
    scenes[i].run();
  });
}

function goNext(){
  if(current === scenes.length-1){ goTo(0); }
  else goTo(current+1);
}
function goPrev(){ goTo(current-1); }

/* ── Controls ── */
$("#btn-next").addEventListener("click", goNext);
$("#btn-prev").addEventListener("click", goPrev);
$(".p-btn", popup).addEventListener("click", function(){ (popupNextFn || goNext)(); });

document.addEventListener("keydown", function(e){
  if(e.key === "ArrowRight" || e.key === " "){ e.preventDefault(); goNext(); }
  else if(e.key === "ArrowLeft"){ e.preventDefault(); goPrev(); }
});

/* ── Auto-play ── */
var playTimer = null;
var autoBtn = $("#autoplay");
function startAuto(){
  autoBtn.classList.add("on");
  autoBtn.innerHTML = "&#10073;&#10073;"; // pause
  playTimer = setInterval(goNext, 5000);
}
function stopAuto(){
  autoBtn.classList.remove("on");
  autoBtn.innerHTML = "&#9654;";
  if(playTimer){ clearInterval(playTimer); playTimer = null; }
}
autoBtn.addEventListener("click", function(){
  if(playTimer) stopAuto(); else startAuto();
});

/* reposition popup on resize */
window.addEventListener("resize", function(){
  if(popup.classList.contains("show")) hidePopup();
});

/* ── Init ── */
buildProgress();
goTo(0);
</script>
